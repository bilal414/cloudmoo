# Heroku Container-stack process definitions. app.json provisions PostgreSQL
# (heroku-postgresql:mini) and the RabbitMQ-only CloudAMQP Little Lemur add-on
# used by these processes.
setup:
  addons:
    - plan: heroku-postgresql:mini
      as: DATABASE
    - plan: cloudamqp:lemur
      as: CLOUDAMQP

build:
  docker:
    web: Dockerfile

release:
  image: web
  command:
    - python manage.py migrate --noinput

run:
  # Heroku assigns $PORT to web dynos. The image's default web path (init.sh)
  # renders the nginx config to listen on $PORT and proxies to gunicorn on
  # 127.0.0.1:8000, so the same image serves Heroku web traffic unchanged.
  web:
    image: web
    command:
      - bash init.sh
  worker:
    image: web
    command:
      - celery -A app_cloudmoo_com worker --loglevel=info
  beat:
    image: web
    command:
      - celery -A app_cloudmoo_com beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

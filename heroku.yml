# Heroku Container-stack process definitions. app.json provisions PostgreSQL
# (heroku-postgresql:essential-0) and the RabbitMQ-only CloudAMQP add-on
# used by these processes.
setup:
  addons:
    - plan: heroku-postgresql:essential-0
      as: DATABASE
    - plan: cloudamqp
      as: CLOUDAMQP

build:
  docker:
    web: Dockerfile

release:
  image: web
  command:
    - python manage.py migrate --noinput

run:
  # Heroku assigns $PORT to web dynos. init.sh detects the non-root Heroku
  # runtime and runs Gunicorn directly on that port; WhiteNoise serves the
  # static assets collected into the image.
  web:
    image: web
    command:
      - bash init.sh
  worker:
    image: web
    command:
      - celery -A app_cloudmoo_com worker --loglevel=info
  beat:
    image: web
    command:
      - celery -A app_cloudmoo_com beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

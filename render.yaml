# Render Blueprint used by the "Deploy to Render" button.
# CloudMoo runs as independent web, worker, and scheduler processes backed by a
# managed PostgreSQL database and a private RabbitMQ service (the Celery broker).
#
# Per-service env vars below wire managed database and private RabbitMQ values
# into the web, worker, and beat processes. settings.py assembles the broker URL
# from RABBITMQ_* when CELERY_BROKER_URL itself is empty.

services:
  - type: web
    name: cloudmoo-web
    runtime: docker
    region: oregon
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    # Readiness checks the database; /healthz/ remains the cheap liveness probe.
    healthCheckPath: /readyz/
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - fromGroup: cloudmoo-common
      - key: DB_NAME
        fromDatabase:
          name: cloudmoo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: cloudmoo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cloudmoo-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: cloudmoo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cloudmoo-db
          property: port
      - key: CELERY_BROKER_URL
        value: ""
      - key: RABBITMQ_HOST
        fromService:
          type: pserv
          name: cloudmoo-rabbitmq
          property: host
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        fromService:
          type: pserv
          name: cloudmoo-rabbitmq
          envVarKey: RABBITMQ_DEFAULT_USER
      - key: RABBITMQ_PASSWORD
        fromService:
          type: pserv
          name: cloudmoo-rabbitmq
          envVarKey: RABBITMQ_DEFAULT_PASS
      - key: RABBITMQ_VHOST
        value: "/"
      - key: APP_DOMAIN
        fromService:
          type: web
          name: cloudmoo-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: cloudmoo-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: worker
    name: cloudmoo-worker
    runtime: docker
    region: oregon
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 300
    dockerCommand: su -s /bin/sh cloudmoo -c 'HOME=/tmp exec celery -A app_cloudmoo_com worker --loglevel=info'
    envVars:
      - fromGroup: cloudmoo-common
      - key: DB_NAME
        fromDatabase:
          name: cloudmoo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: cloudmoo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cloudmoo-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: cloudmoo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cloudmoo-db
          property: port
      - key: CELERY_BROKER_URL
        value: ""
      - key: RABBITMQ_HOST
        fromService:
          type: pserv
          name: cloudmoo-rabbitmq
          property: host
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        fromService:
          type: pserv
          name: cloudmoo-rabbitmq
          envVarKey: RABBITMQ_DEFAULT_USER
      - key: RABBITMQ_PASSWORD
        fromService:
          type: pserv
          name: cloudmoo-rabbitmq
          envVarKey: RABBITMQ_DEFAULT_PASS
      - key: RABBITMQ_VHOST
        value: "/"
      - key: APP_DOMAIN
        fromService:
          type: web
          name: cloudmoo-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: cloudmoo-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  # beat MUST stay a single instance — running more than one fires scheduled
  # checks multiple times.
  - type: worker
    name: cloudmoo-beat
    runtime: docker
    region: oregon
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    dockerCommand: su -s /bin/sh cloudmoo -c 'HOME=/tmp exec celery -A app_cloudmoo_com beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler'
    envVars:
      - fromGroup: cloudmoo-common
      - key: DB_NAME
        fromDatabase:
          name: cloudmoo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: cloudmoo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cloudmoo-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: cloudmoo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cloudmoo-db
          property: port
      - key: CELERY_BROKER_URL
        value: ""
      - key: RABBITMQ_HOST
        fromService:
          type: pserv
          name: cloudmoo-rabbitmq
          property: host
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        fromService:
          type: pserv
          name: cloudmoo-rabbitmq
          envVarKey: RABBITMQ_DEFAULT_USER
      - key: RABBITMQ_PASSWORD
        fromService:
          type: pserv
          name: cloudmoo-rabbitmq
          envVarKey: RABBITMQ_DEFAULT_PASS
      - key: RABBITMQ_VHOST
        value: "/"
      - key: APP_DOMAIN
        fromService:
          type: web
          name: cloudmoo-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: cloudmoo-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  # Private RabbitMQ (Celery broker). The password is generated by Render and
  # injected into the three application processes above.
  - type: pserv
    name: cloudmoo-rabbitmq
    runtime: image
    region: oregon
    plan: starter
    numInstances: 1
    image:
      url: docker.io/library/rabbitmq:3-management
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: cloudmoo
      - key: RABBITMQ_DEFAULT_PASS
        generateValue: true

databases:
  - name: cloudmoo-db
    databaseName: cloudmoo
    user: cloudmoo
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "18"
    # The app uses the private connection string, not public database access.
    ipAllowList: []

envVarGroups:
  - name: cloudmoo-common
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SERVER
        value: production
      - key: APP_PROTOCOL
        value: "https://"
      - key: HTTPS_ENABLED
        value: "true"
      - key: RATE_LIMIT_TRUST_X_FORWARDED_FOR
        # Render's edge proxy supplies the canonical client-address header.
        value: "true"
      - key: REGISTRATION_OPEN
        # Keep the first-run sign-up available. Disable it after the instance
        # owner has created and verified the initial account.
        value: "true"

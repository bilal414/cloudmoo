<!DOCTYPE html>
<html lang="en" class="h-full bg-white">
<head>
    <title>{% block title %}Dashboard{% endblock %}</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="author" content="{% block author %}CloudMoo{% endblock %}">
    <!-- Fonts -->
    <link rel="icon" href="{{ STATIC_URL }}console/images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link type="text/css" href="{{ STATIC_URL }}console/css/compiled.css?v=1.2" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/flowbite@1.5.2/dist/flowbite.min.css"/>
    {% csrf_token %}
</head>
<body class="lexend-font h-full{% block page_class %}{% endblock %}">
<div x-data="{ sideBar: false }">
    {% include "_sidebar.html" %}
    <div class="lg:pl-72">
        {% include "_header.html" %}
        <main class="py-10 pt-5 flex-auto justify-between">
            <div class="px-4 sm:px-6 lg:px-8 mb-auto">
                {% block content %}{% endblock %}
            </div>
            {% include "_footer.html" %}

        </main>

    </div>
</div>
{% block extra_scripts %}{% endblock %}
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://unpkg.com/flowbite@1.5.2/dist/flowbite.js"></script>
<script src="https://unpkg.com/flowbite@1.5.2/dist/datepicker.js"></script>
{% include "_notifications.html" %}
{% include "_loading.html" %}
</body>
</html>

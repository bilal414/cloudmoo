<html>
<head>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div x-data="awsText()">
    <button @click="showMessage('test')">Show Message</button>
    <button @click="makeApiCall()">Make API Call</button>

   <input type="text" x-model="message">
    <span type="text" x-text="title"></span>                                               v
</div>

  <!--  <div x-show="open">
        Dropdown Contents...
    </div> -->
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('awsText', () => ({
            open: false,
            message: null,
            title: null,
            showMessage(message = "Default Message") {
                this.open = !this.open;
                alert(this.message)
            },

            makeApiCall() {
                fetch('https://jsonplaceholder.typicode.com/todos/1', {
                    method: 'GET',
                }).then((res) => {
                    return res.json()
                }).then(response => {
                    this.title = response.title
                    this.message = response.title
                    return response
                }).catch(
                    (err) => {
                        console.error(err)
                    }
                )
            }
        }));
    })
</script>
</body>
</html>

<!-- apps/console/_templates/console/cloud/_cloud_providers.html -->
<div class="mt-8">
    <h2 class="text-2xl font-light leading-6 text-gray-900">Available Cloud Providers</h2>
    <p class="mt-2 text-sm text-gray-600">Connect your cloud providers to start monitoring your infrastructure</p>

    <div class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <div class="relative flex items-center space-x-3 rounded-lg border border-gray-300 bg-white px-6 py-5 shadow-sm hover:border-gray-400">
            <div class="flex-shrink-0">
                <img class="h-10 w-10" src="{{ STATIC_URL }}console/images/clouds/digitalocean.svg" alt="DigitalOcean">
            </div>
            <div class="min-w-0 flex-1">
                <a href="{% url 'console:cloud:digitalocean:connect' %}" class="focus:outline-none">
                    <span class="absolute inset-0" aria-hidden="true"></span>
                    <p class="text-sm  text-gray-900">DigitalOcean</p>
                    <p class="truncate text-sm text-gray-500">Connect your DigitalOcean account</p>
                </a>
            </div>
        </div>

        <div class="relative flex items-center space-x-3 rounded-lg border border-gray-300 bg-white px-6 py-5 shadow-sm hover:border-gray-400">
            <div class="flex-shrink-0">
                <img class="h-10 w-10" src="{{ STATIC_URL }}console/images/clouds/vultr.svg" alt="Vultr">
            </div>
            <div class="min-w-0 flex-1">
                <a href="{% url 'console:cloud:vultr:connect' %}" class="focus:outline-none">
                    <span class="absolute inset-0" aria-hidden="true"></span>
                    <p class="text-sm  text-gray-900">Vultr</p>
                    <p class="truncate text-sm text-gray-500">Connect your Vultr account</p>
                </a>
            </div>
        </div>

        <div class="relative flex items-center space-x-3 rounded-lg border border-gray-300 bg-white px-6 py-5 shadow-sm hover:border-gray-400">
            <div class="flex-shrink-0">
                <img class="h-10 w-10" src="{{ STATIC_URL }}console/images/clouds/hetzner.svg" alt="Hetzner">
            </div>
            <div class="min-w-0 flex-1">
                <a href="{% url 'console:cloud:hetzner:connect' %}" class="focus:outline-none">
                    <span class="absolute inset-0" aria-hidden="true"></span>
                    <p class="text-sm  text-gray-900">Hetzner</p>
                    <p class="truncate text-sm text-gray-500">Connect your Hetzner account</p>
                </a>
            </div>
        </div>
    </div>
</div>

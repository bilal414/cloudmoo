<!DOCTYPE html><html lang="en" class="h-full"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>404 - Page Not Found</title>    <script src="https://cdn.tailwindcss.com"></script></head><body class="h-full"><main class="grid min-h-full place-items-center bg-white px-6 py-24 sm:py-32 lg:px-8">    <div class="text-center">        <!-- 404 Icon -->        <div class="flex justify-center">            <svg class="h-24 w-24 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"                 stroke-width="1.5" stroke="currentColor">                <path stroke-linecap="round" stroke-linejoin="round"                      d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"></path>            </svg>        </div>        <!-- Error Message -->        <h1 class="mt-4 text-3xl font-bold tracking-tight text-gray-900 sm:text-5xl">500 - System Error</h1>        <p class="mt-6 text-base leading-7 text-gray-600">An unexpected error occurred. Our technical team has been            notified and will resolve this as soon as possible.</p>        <!-- Action Buttons -->        <div class="mt-10 flex items-center justify-center gap-x-6">            <a href="/"               class="rounded-md bg-indigo-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">                Go back home            </a>            <a href="mailto:support@cloudmoo.com" class="text-sm font-semibold text-gray-900 hover:text-indigo-600">                Contact support <span aria-hidden="true">&rarr;</span>            </a>        </div>    </div></main></body></html>

# Preserve the original scheme supplied by a trusted platform load balancer.
# Without this map, nginx would replace an incoming HTTPS indication with its
# own internal HTTP scheme and Django's secure redirect could loop forever.
map $http_x_forwarded_proto $cloudmoo_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Template rendered by init.sh at container start: __PORT__ is replaced with
# $PORT (default 80) so PaaS platforms (Heroku/Render/Railway) can assign the
# listen port while nginx keeps proxying to gunicorn on 127.0.0.1:8000.
server {
    listen __PORT__;

    server_name _;

    location /static/ {
        alias /code/static/;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Proto $cloudmoo_forwarded_proto;
        proxy_pass http://127.0.0.1:8000;
    }
}
